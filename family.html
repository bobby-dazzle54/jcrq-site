<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JCRQ FM</title>
<meta name="description" content="JCRQ FM. A private office.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  :root{
    color-scheme: dark;
    --ink:#070b12;
    --sea:#0a0f18;
    --bone:#ece5d6;
    --bone-dim:rgba(236,229,214,.76);
    --bone-faint:rgba(236,229,214,.48);
    --gold:#c8a76b;
    --focus:#e6cf95;
    --display:"Marcellus","Cormorant Garamond",Georgia,"Times New Roman",serif;
    --text:"EB Garamond","Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--sea);
    color:var(--bone);
    font-family:var(--text);
    font-size:16px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;background:var(--sea);}
  .veil{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(58% 52% at 24% 50%, rgba(7,11,18,.40), rgba(7,11,18,0) 72%),
      linear-gradient(to top, rgba(7,11,18,.62), rgba(7,11,18,0) 30%),
      linear-gradient(to bottom, rgba(7,11,18,.22), rgba(7,11,18,0) 18%);
  }
  .page{
    position:relative;z-index:2;
    min-height:100%;
    box-sizing:border-box;
    display:grid;
    grid-template-rows:1fr auto;
    padding-inline:clamp(24px,7vw,104px);
    padding-block:clamp(28px,6vh,72px);
  }
  .mark-block{
    align-self:center;
    animation:rise 1.3s cubic-bezier(.2,.6,.2,1) .1s both;
  }
  .mark{
    margin:0 0 0 -.04em;
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(2.5rem,6.2vw,4.75rem);
    line-height:1;
    letter-spacing:.3em;
    white-space:nowrap;
    color:var(--bone);
  }
  .rule{
    width:3.25rem;height:1px;
    background:var(--gold);
    margin:1.7rem 0 1.5rem;
    opacity:.9;
  }
  .line{
    margin:0;
    max-width:24ch;
    font-size:clamp(1.2rem,1.85vw,1.5rem);
    font-style:italic;
    line-height:1.42;
    color:var(--bone-dim);
    text-wrap:pretty;
  }
  .note{
    margin:2.1rem 0 0;
    font-family:var(--display);
    font-size:.72rem;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--gold);
    opacity:.85;
  }
  /* the gate */
  .gate{display:flex;align-items:baseline;gap:1rem;margin:0;}
  .key{
    width:min(15rem,60vw);
    background:none;border:0;border-radius:0;
    border-bottom:1px solid rgba(236,229,214,.28);
    color:var(--bone);
    font-family:var(--text);
    font-size:1.15rem;
    letter-spacing:.14em;
    padding:.25rem 0 .35rem;
    outline:none;
    transition:border-color .35s ease;
  }
  .key:focus{border-color:var(--gold);}
  .key::placeholder{color:transparent;}
  .gate.no .key{border-color:rgba(200,167,107,.9);animation:nudge .5s ease;}
  .enter{
    font-family:var(--display);
    font-size:.66rem;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--bone-faint);
    background:none;border:0;
    padding:.3rem .2rem;
    cursor:pointer;
    transition:color .3s ease;
  }
  .enter:hover,.gate.no .enter{color:var(--gold);}
  .user{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}
  .gate{flex-wrap:wrap;position:relative;}
  .keep{
    flex-basis:100%;
    display:inline-flex;align-items:center;gap:.55rem;
    margin-top:1.1rem;
    font-family:var(--display);
    font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--bone-faint);cursor:pointer;user-select:none;
    transition:color .3s ease;
  }
  .keep:hover{color:var(--bone-dim);}
  .keep input{position:absolute;opacity:0;width:0;height:0;}
  .keep i{width:.8rem;height:.8rem;border:1px solid rgba(236,229,214,.4);border-radius:2px;flex:none;position:relative;transition:border-color .3s ease;}
  .keep input:checked+i{border-color:var(--gold);}
  .keep input:checked+i::after{content:"";position:absolute;inset:3px;background:var(--gold);}
  .keep input:focus-visible+i{outline:1px solid var(--focus);outline-offset:3px;}
  .gate.busy .enter{color:var(--bone-faint);pointer-events:none;}
  #private{animation:rise 1.1s cubic-bezier(.2,.6,.2,1) both;}
  #private[hidden]{display:none;}
  .foot{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:1rem 2.5rem;
    animation:rise 1.3s cubic-bezier(.2,.6,.2,1) .55s both;
  }
  .contact{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;min-height:1.5rem;}
  .mail{
    color:var(--bone);
    text-decoration:none;
    font-size:1.08rem;
    letter-spacing:.01em;
    padding-bottom:2px;
    border-bottom:1px solid rgba(236,229,214,.28);
    transition:border-color .35s ease;
  }
  .mail:hover{border-color:var(--gold);}
  .copy{
    font-family:var(--display);
    font-size:.66rem;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--bone-faint);
    background:none;border:0;
    padding:.3rem .2rem;
    cursor:pointer;
    transition:color .3s ease;
  }
  .copy:hover{color:var(--gold);}
  .legal{
    margin:0;
    font-family:var(--display);
    font-size:.66rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--bone-faint);
  }
  a:focus-visible,button:focus-visible{outline:1px solid var(--focus);outline-offset:4px;border-radius:1px;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes nudge{0%,100%{transform:none;}25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}
  @media (max-aspect-ratio: 4/5){
    .mark-block{align-self:end;padding-bottom:7vh;}
    .veil{
      background:
        radial-gradient(72% 46% at 42% 74%, rgba(7,11,18,.44), rgba(7,11,18,0) 72%),
        linear-gradient(to top, rgba(7,11,18,.66), rgba(7,11,18,0) 34%),
        linear-gradient(to bottom, rgba(7,11,18,.2), rgba(7,11,18,0) 16%);
    }
  }
  @media (prefers-reduced-motion: reduce){
    .mark-block,.foot,#private{animation:none;}
    .mail,.copy,.key,.enter{transition:none;}
    .gate.no .key{animation:none;}
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<main class="page">
  <section class="mark-block">
    <h1 class="mark">JCRQ FM</h1>
    <div class="rule" aria-hidden="true"></div>
    <form class="gate" id="gate" method="post" action="#" autocomplete="on">
      <input class="user" type="text" name="username" value="jcrq" autocomplete="username" tabindex="-1" aria-hidden="true">
      <input class="key" id="key" name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" spellcheck="false" autocapitalize="off" enterkeyhint="go">
      <button type="submit" class="enter" id="enter">Enter</button>
      <label class="keep"><input type="checkbox" id="keep" checked><i aria-hidden="true"></i>Keep me signed in on this device</label>
    </form>
    <div id="private" hidden></div>
  </section>
  <footer class="foot">
    <div class="contact" id="contact"></div>
    <p class="legal">&copy; 2026 JCRQ FM</p>
  </footer>
</main>

<script>
(function(){
  'use strict';
  /* the gate needs a secure context: send plain http to https */
  if(location.protocol==='http:'&&location.hostname.indexOf('.')>0){location.replace('https://'+location.host+location.pathname+location.search);return;}
  /* ---------- the gate ---------- */
  var gate=document.getElementById('gate'),key=document.getElementById('key'),enter=document.getElementById('enter');
  var priv=document.getElementById('private'),contact=document.getElementById('contact');
  var BLOB=document.getElementById('locked').textContent.trim();
  var ITER=250000;
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function open(pw){
    var raw=b64(BLOB),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28),enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey'])
      .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);})
      .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct);})
      .then(function(buf){return JSON.parse(new TextDecoder().decode(buf));});
  }
  function reveal(d){
    if(d.page){document.open();document.write(d.page);document.close();return;}
    priv.innerHTML=d.private;priv.hidden=false;
    contact.innerHTML=d.contact;
    gate.parentNode.removeChild(gate);
    bindCopy();
  }
  function bindCopy(){
    var mailEl=document.getElementById('mail'),copyBtn=document.getElementById('copy');
    if(!mailEl||!copyBtn)return;
    var ADDRESS=mailEl.textContent.trim();
    function copied(){copyBtn.textContent='Copied';setTimeout(function(){copyBtn.textContent='Copy';},1800);}
    function selectAddress(){
      try{var r=document.createRange();r.selectNodeContents(mailEl);var s=window.getSelection();s.removeAllRanges();s.addRange(r);
        if(document.execCommand&&document.execCommand('copy'))copied();}catch(e){}
    }
    copyBtn.addEventListener('click',function(){
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ADDRESS).then(copied,selectAddress);}
      else selectAddress();
    });
  }
  var keep=document.getElementById('keep');
  function forget(){try{localStorage.removeItem('jcrq-remember');sessionStorage.removeItem('jcrq');}catch(e){}}
  function attempt(pw,how){
    if(!pw||!window.crypto||!crypto.subtle)return;
    gate.classList.remove('no');gate.classList.add('busy');
    open(pw).then(function(d){
      try{
        if(how==='device'){localStorage.setItem('jcrq-remember',pw);sessionStorage.setItem('jcrq',pw);}
        else if(how==='tab'){sessionStorage.setItem('jcrq',pw);}
      }catch(e){}
      reveal(d);
    },function(){
      if(how==='auto'){forget();gate.classList.remove('busy');return;}
      gate.classList.remove('busy');gate.classList.add('no');key.value='';key.focus();
      setTimeout(function(){gate.classList.remove('no');},900);
    });
  }
  gate.addEventListener('submit',function(e){e.preventDefault();attempt(key.value,keep&&keep.checked?'device':'tab');});
  /* the dashboard's Sign out calls this before reloading */
  window.jcrqSignOut=forget;
  try{var s=localStorage.getItem('jcrq-remember')||sessionStorage.getItem('jcrq');if(s)attempt(s,'auto');}catch(e){}

  /* ---------- the coast ---------- */
  var cv=document.getElementById('scene');
  var ctx=cv.getContext('2d',{alpha:false});
  var REDUCE=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var TAU=Math.PI*2;
  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function lerp(a,b,t){return a+(b-a)*t;}
  function sstep(a,b,x){x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);}
  function ihash(i){i=i|0;i=Math.imul(i^(i>>>16),0x45d9f3b);i=Math.imul(i^(i>>>16),0x45d9f3b);i^=i>>>16;return (i>>>0)/4294967296;}
  function n1(x,seed){var i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(ihash(i*1619+seed*31337),ihash((i+1)*1619+seed*31337),u);}
  function fbm1(x,seed,oct){var s=0,a=.5,n=0;for(var o=0;o<oct;o++){s+=a*n1(x,seed+o*7);n+=a;x=x*2.07+3.1;a*=.5;}return s/n;}
  function vn2(x,y,px,py,seed){
    var xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
    function h(a,b){return ihash((((a%px)+px)%px)*1973+(((b%py)+py)%py)*9277+seed*26699);}
    return lerp(lerp(h(xi,yi),h(xi+1,yi),ux),lerp(h(xi,yi+1),h(xi+1,yi+1),ux),uy);
  }
  function rng(seed){var s=seed>>>0;return function(){s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}

  /* headlands, nearest first. eP/eL: seaward end as a fraction of width (portrait/landscape) */
  /* sdx/sdy: how far the waterline at the tip recedes toward the viewer (down-left) */
  var LAYERS=[
    {eP:.52,eL:.36,foot:.09, amp:.27, freq:1.9,fall:.42,rise:.45,sdxP:.5,sdx:.30,sdy:1.2, col:'#070b12',col2:'#04070c',al:1,  seed:11},
    {eP:.64,eL:.48,foot:.03, amp:.18, freq:2.2,fall:.45,rise:.30,sdxP:.14,sdx:.10,sdy:.045,col:'#0e1520',col2:'#090e17',al:1,  seed:23},
    {eP:.75,eL:.60,foot:.012,amp:.125,freq:2.6,fall:.50,rise:.20,sdxP:.06,sdx:.05,sdy:.014,col:'#18212d',col2:null,     al:.96,seed:37},
    {eP:.85,eL:.71,foot:.004,amp:.085,freq:3.0,fall:.55,rise:.12,sdxP:.03,sdx:.02,sdy:.005,col:'#243040',col2:null,     al:.90,seed:51},
    {eP:.93,eL:.82,foot:0,   amp:.055,freq:3.4,fall:.60,rise:.08,sdxP:0,  sdx:0,  sdy:0,   col:'#31404f',col2:null,     al:.82,seed:67}
  ];

  var W=0,H=0,dpr=1,yh=0,gx=0,T=0,ampScale=1;
  var base=null,near=null,mistA=null,mistB=null,grainPat=null;
  var stars=[],glints=[],lx=0,ly=0;
  var tileA=null,tileB=null,grainTile=null;

  function mk(w,h){var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*dpr));c.height=Math.max(1,Math.round(h*dpr));return c;}

  function layerEnd(L){return W*lerp(L.eP,L.eL,T);}
  function profile(L,x){
    var end=layerEnd(L);if(x>end)return yh+L.foot*H;
    var q=clamp((end-x)/(L.fall*end),0,1);
    var env=Math.pow(q,.5);
    var rise=1+L.rise*(1-x/end);
    var n=fbm1(x/W*L.freq*2.4,L.seed,5);
    var h=L.amp*ampScale*H*env*rise*(.55+.45*n);
    return yh+L.foot*H-h;
  }
  function shorePoints(L){
    var end=layerEnd(L),footY=yh+L.foot*H,dx=W*lerp(L.sdxP,L.sdx,T),dy=L.sdy*H,pts=[];
    if(dx<=0)return pts;
    for(var k=1;k<=28;k++){var s=k/28;
      pts.push([end-dx*s, footY+dy*Math.pow(s,1.35)+(fbm1(s*4+L.seed,L.seed+99,3)-.5)*Math.min(dy,H*.06)*.5]);}
    return pts;
  }
  function drawLayer(g,L,toBottom){
    var end=layerEnd(L),footY=yh+L.foot*H;
    var shore=shorePoints(L);
    var baseY=toBottom?H+2:(shore.length?shore[shore.length-1][1]+1:footY+1);
    g.beginPath();
    g.moveTo(0,baseY);
    for(var x=0;x<=end;x+=1.5){g.lineTo(x,profile(L,x));}
    g.lineTo(end,footY+1);
    for(var i=0;i<shore.length;i++)g.lineTo(shore[i][0],shore[i][1]);
    g.lineTo(0,baseY);
    g.closePath();
    if(L.col2){
      var top=profile(L,0)-20;
      var gr=g.createLinearGradient(0,top,0,toBottom?H:footY);
      gr.addColorStop(0,L.col);gr.addColorStop(1,L.col2);g.fillStyle=gr;
    }else g.fillStyle=L.col;
    g.globalAlpha=L.al;g.fill();g.globalAlpha=1;
    /* a breath of white water at the foot of the nearest cliffs */
    if(toBottom&&shore.length){
      g.beginPath();g.moveTo(end,footY+1);
      for(i=0;i<shore.length;i++)g.lineTo(shore[i][0],shore[i][1]);
      g.strokeStyle='rgba(205,214,224,.09)';g.lineWidth=2;g.lineCap='round';g.stroke();
    }
  }

  function mistTile(w,h,seed,lo,hi){
    var c=document.createElement('canvas');c.width=w;c.height=h;
    var g=c.getContext('2d'),img=g.createImageData(w,h),d=img.data,P=3;
    for(var j=0;j<h;j++)for(var i=0;i<w;i++){
      var s=0,a=.5,n=0;
      for(var o=0;o<5;o++){var cx=P<<o,cy=Math.max(1,Math.round(cx*h/w*3));s+=a*vn2(i/w*cx,j/h*cy,cx,cy,seed+o*13);n+=a;a*=.55;}
      s/=n;var v=sstep(lo,hi,s),k=(j*w+i)*4;
      d[k]=206;d[k+1]=216;d[k+2]=226;d[k+3]=Math.round(v*255);
    }
    g.putImageData(img,0,0);return c;
  }
  function band(tile,y0,y1){
    var bw=Math.ceil(W*1.6),bh=Math.max(2,y1-y0);
    var c=mk(bw,bh),g=c.getContext('2d');g.scale(dpr,dpr);
    g.drawImage(tile,0,0,bw/2,bh);g.drawImage(tile,bw/2,0,bw/2,bh);
    g.globalCompositeOperation='destination-in';
    var m=g.createLinearGradient(0,0,0,bh);
    m.addColorStop(0,'rgba(0,0,0,0)');m.addColorStop(.32,'rgba(0,0,0,1)');m.addColorStop(.68,'rgba(0,0,0,1)');m.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=m;g.fillRect(0,0,bw,bh);
    return {c:c,bw:bw,bh:bh,y:y0};
  }
  function drawBand(b,off,al){
    off=((off%b.bw)+b.bw)%b.bw;
    ctx.globalAlpha=al;
    ctx.drawImage(b.c,-off,b.y,b.bw,b.bh);
    ctx.drawImage(b.c,b.bw-off,b.y,b.bw,b.bh);
    ctx.globalAlpha=1;
  }
  function makeGrain(){
    var c=document.createElement('canvas');c.width=c.height=128;
    var g=c.getContext('2d'),img=g.createImageData(128,128),d=img.data,r=rng(9);
    for(var k=0;k<d.length;k+=4){var v=128+Math.round((r()-.5)*44);d[k]=d[k+1]=d[k+2]=v;d[k+3]=255;}
    g.putImageData(img,0,0);return c;
  }

  function build(){
    W=window.innerWidth;H=window.innerHeight;
    dpr=Math.min(window.devicePixelRatio||1,1.75);
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    var a=W/H;T=clamp((a-.5)/1.3,0,1);
    yh=Math.round(H*lerp(.52,.60,T));
    gx=W*lerp(.80,.72,T);
    ampScale=lerp(.85,1,T);

    if(!tileA){tileA=mistTile(384,192,5,.50,.78);tileB=mistTile(384,192,29,.45,.74);grainTile=makeGrain();grainPat=ctx.createPattern(grainTile,'repeat');}

    /* base: sky, sea, afterglow, far headlands */
    base=mk(W,H);var g=base.getContext('2d');g.scale(dpr,dpr);
    var sky=g.createLinearGradient(0,0,0,yh);
    sky.addColorStop(0,'#070c17');sky.addColorStop(.42,'#121c2f');sky.addColorStop(.72,'#24344e');
    sky.addColorStop(.9,'#4b5a73');sky.addColorStop(.97,'#8c8b94');sky.addColorStop(1,'#c6ae95');
    g.fillStyle=sky;g.fillRect(0,0,W,yh+1);

    var sea=g.createLinearGradient(0,yh,0,H);
    sea.addColorStop(0,'#7d7c84');sea.addColorStop(.035,'#47526b');sea.addColorStop(.18,'#242f42');
    sea.addColorStop(.6,'#111924');sea.addColorStop(1,'#080c14');
    g.fillStyle=sea;g.fillRect(0,yh,W,H-yh);

    /* afterglow in the sky */
    g.save();g.beginPath();g.rect(0,0,W,yh);g.clip();
    g.translate(gx,yh);g.scale(1,.42);
    var glow=g.createRadialGradient(0,0,0,0,0,W*.45);
    glow.addColorStop(0,'rgba(240,208,164,.62)');glow.addColorStop(.3,'rgba(222,176,140,.28)');glow.addColorStop(1,'rgba(200,150,130,0)');
    g.fillStyle=glow;g.fillRect(-W,-H*3,W*2,H*6);
    g.restore();
    /* its reflection */
    g.save();g.beginPath();g.rect(0,yh,W,H-yh);g.clip();
    g.translate(gx,yh);g.scale(.32,1);
    var ref=g.createRadialGradient(0,0,0,0,0,H*.28);
    ref.addColorStop(0,'rgba(226,190,150,.42)');ref.addColorStop(.5,'rgba(200,165,140,.12)');ref.addColorStop(1,'rgba(180,150,140,0)');
    g.fillStyle=ref;g.fillRect(-W*4,-H,W*8,H*2);
    g.restore();

    for(var i=4;i>=2;i--)drawLayer(g,LAYERS[i],false);
    /* sea haze along the horizon */
    var hz=g.createLinearGradient(0,yh-H*.05,0,yh+H*.02);
    hz.addColorStop(0,'rgba(150,150,160,0)');hz.addColorStop(.7,'rgba(160,158,165,.22)');hz.addColorStop(1,'rgba(160,158,165,0)');
    g.fillStyle=hz;g.fillRect(0,yh-H*.05,W,H*.07);

    /* near headlands */
    near=mk(W,H);var gn=near.getContext('2d');gn.scale(dpr,dpr);
    drawLayer(gn,LAYERS[1],false);
    drawLayer(gn,LAYERS[0],true);

    /* mist bands */
    mistB=band(tileB,yh-H*.06,yh+H*.10);
    mistA=band(tileA,yh+H*.03,yh+H*.28);

    /* stars */
    var r=rng(1234);stars=[];
    for(i=0;i<46;i++){var sy=r()*yh*.62;stars.push({x:r()*W,y:sy,r:.35+r()*.75,a:(.18+r()*.45)*(1-sy/(yh*.9)),w:.6+r()*1.2,p:r()*TAU});}

    /* light on the water */
    r=rng(777);glints=[];
    for(i=0;i<26;i++){var u=r(),y=yh+1.5+u*u*H*.14,spread=.05+.15*(y-yh)/(H*.14);
      glints.push({x:gx+(r()-.5)*W*spread,y:y,len:W*(.015+r()*.075),lw:.7+r()*.8,a:.05+r()*.2,w:.5+r()*1.1,p:r()*TAU,c:'232,212,180'});}
    for(i=0;i<12;i++){var yy=yh+H*(.15+r()*.3);
      glints.push({x:W*lerp(.55,.42,T)+r()*W*.6,y:yy,len:W*(.1+r()*.24),lw:1,a:.018+r()*.04,w:.3+r()*.6,p:r()*TAU,c:'150,172,198'});}

    /* the lighthouse on the third headland */
    var L=LAYERS[3];lx=layerEnd(L)*.975;ly=profile(L,lx)-1.5;
  }

  function render(t){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    ctx.drawImage(base,0,0,W,H);
    var i,s,a;
    for(i=0;i<stars.length;i++){s=stars[i];a=s.a*(REDUCE?1:(.65+.35*Math.sin(t*s.w+s.p)));
      ctx.fillStyle='rgba(230,232,240,'+a.toFixed(3)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();}
    ctx.lineCap='round';
    for(i=0;i<glints.length;i++){s=glints[i];a=s.a*(REDUCE?.7:(.5+.5*Math.sin(t*s.w+s.p)));if(a<.008)continue;
      var x0=s.x-s.len/2,x1=s.x+s.len/2,lg=ctx.createLinearGradient(x0,0,x1,0);
      lg.addColorStop(0,'rgba('+s.c+',0)');lg.addColorStop(.5,'rgba('+s.c+','+a.toFixed(3)+')');lg.addColorStop(1,'rgba('+s.c+',0)');
      ctx.strokeStyle=lg;ctx.lineWidth=s.lw;ctx.beginPath();ctx.moveTo(x0,s.y);ctx.lineTo(x1,s.y);ctx.stroke();}
    drawBand(mistB,t*3,.26);
    /* one white flash every ten seconds */
    var ph=t%10,k=0;
    if(ph<.7)k=ph<.22?ph/.22:1-(ph-.22)/.48;
    if(REDUCE)k=.55;
    if(k>0){var rg=ctx.createRadialGradient(lx,ly,0,lx,ly,18);
      rg.addColorStop(0,'rgba(255,246,220,'+(.75*k).toFixed(3)+')');rg.addColorStop(.22,'rgba(255,238,200,'+(.3*k).toFixed(3)+')');rg.addColorStop(1,'rgba(255,238,200,0)');
      ctx.fillStyle=rg;ctx.fillRect(lx-18,ly-18,36,36);
      ctx.fillStyle='rgba(255,251,238,'+k.toFixed(3)+')';ctx.beginPath();ctx.arc(lx,ly,1.1,0,TAU);ctx.fill();}
    ctx.drawImage(near,0,0,W,H);
    drawBand(mistA,t*8,.17);
    ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.42;ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  }

  var last=0,raf=0,t0=performance.now();
  function frame(now){
    raf=requestAnimationFrame(frame);
    if(now-last<33)return;last=now;
    render((now-t0)/1000);
  }
  build();render(0);
  if(!REDUCE){
    raf=requestAnimationFrame(frame);
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){cancelAnimationFrame(raf);raf=0;}
      else if(!raf){raf=requestAnimationFrame(frame);}
    });
  }
  var rt=0;
  window.addEventListener('resize',function(){
    clearTimeout(rt);
    rt=setTimeout(function(){build();render(REDUCE?0:(performance.now()-t0)/1000);},120);
  });
})();
</script>
</body>
</html>
